name: Weekly dependency update

# Keeps pi and RTK current without manual tracking. Runs the full gate
# (typecheck, tests, formatting, and a real multi-arch image build) and opens a
# PR only when something changed and everything passed. Nothing reaches the
# add-on until you merge.
on:
  schedule:
    # Mondays at 04:19 UTC — deliberately off the hour, since :00 is heavily contended.
    - cron: '19 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Bump pi + RTK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pi packages are resolved from package.json rather than hardcoded, so
      # this keeps working across the @mariozechner -> @earendil-works rename
      # without needing an edit here.
      - name: Update pi packages
        id: pi
        run: |
          set -euo pipefail
          BEFORE=$(jq -r '.dependencies | to_entries
            | map(select(.key | endswith("/pi-coding-agent") or endswith("/pi-ai")))
            | map("\(.key)@\(.value)") | join(", ")' package.json)

          PKGS=$(jq -r '.dependencies | keys[]
            | select(endswith("/pi-coding-agent") or endswith("/pi-ai"))' package.json | tr '\n' ' ')

          if [ -z "${PKGS// /}" ]; then
            echo "No pi packages found in dependencies — skipping." >&2
            exit 1
          fi

          echo "Updating: $PKGS"
          # shellcheck disable=SC2086
          pnpm update --latest $PKGS

          AFTER=$(jq -r '.dependencies | to_entries
            | map(select(.key | endswith("/pi-coding-agent") or endswith("/pi-ai")))
            | map("\(.key)@\(.value)") | join(", ")' package.json)

          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      # Uses the /releases/latest redirect rather than the REST API: no auth,
      # no 60-req/hour anonymous rate limit. Same approach as RTK's own installer.
      - name: Update RTK version pin
        id: rtk
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '^ARG RTK_VERSION=\K.*' docker/Dockerfile)
          LATEST=$(curl -sI https://github.com/rtk-ai/rtk/releases/latest \
            | grep -i '^location:' \
            | sed -E 's|.*/tag/([^[:space:]]+).*|\1|' \
            | tr -d '\r')

          if [ -z "$LATEST" ]; then
            echo "Could not resolve the latest RTK tag — leaving the pin at $CURRENT." >&2
            LATEST="$CURRENT"
          fi

          if [ "$LATEST" != "$CURRENT" ]; then
            sed -i -E "s|^ARG RTK_VERSION=.*|ARG RTK_VERSION=${LATEST}|" docker/Dockerfile
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Stop early if nothing changed
        id: changed
        run: |
          if git diff --quiet; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      # The Supervisor decides whether to offer an update by comparing the
      # installed add-on version against config.yaml, and build.yml derives its
      # image tags from that same field. Merging without a bump would therefore
      # republish the *same* version tag with different content and offer no
      # device an update — the weekly run would silently deliver nothing. The
      # bump is part of the update, not an afterthought left to the maintainer.
      - name: Bump add-on patch version
        id: version
        if: steps.changed.outputs.any == 'true'
        env:
          PI_BEFORE: ${{ steps.pi.outputs.before }}
          PI_AFTER: ${{ steps.pi.outputs.after }}
          RTK_BEFORE: ${{ steps.rtk.outputs.current }}
          RTK_AFTER: ${{ steps.rtk.outputs.latest }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '^version:\s*\K.*' config.yaml | tr -d "\"' ")
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST##*.}
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          sed -i -E "s|^version:.*|version: ${NEXT}|" config.yaml
          sed -i -E "0,/\"version\": \"[^\"]*\"/s||\"version\": \"${NEXT}\"|" package.json

          # Prepend a release entry so the changelog stays truthful for versions
          # that ship without a human writing them up.
          NOTES=$(mktemp)
          {
            echo "# Changelog"
            echo
            echo "## ${NEXT} — Automated dependency update"
            echo
            echo "### Changed"
            echo
            echo "- **pi**: \`${PI_BEFORE}\` → \`${PI_AFTER}\`"
            echo "- **RTK**: \`${RTK_BEFORE}\` → \`${RTK_AFTER}\`"
            echo
            tail -n +2 CHANGELOG.md | sed '1{/^$/d}'
          } > "$NOTES"
          mv "$NOTES" CHANGELOG.md

          echo "Bumped ${CURRENT} -> ${NEXT}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # ─── Gate ────────────────────────────────────────────────────────────────
      # Everything below runs only when there is something to ship, and any
      # failure aborts before the PR is opened.

      - name: Reinstall against updated lockfile
        if: steps.changed.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.changed.outputs.any == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.changed.outputs.any == 'true'
        run: pnpm test

      - name: Check formatting
        if: steps.changed.outputs.any == 'true'
        run: pnpm format:check

      - name: Set up QEMU
        if: steps.changed.outputs.any == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.any == 'true'
        uses: docker/setup-buildx-action@v3

      # Builds both architectures without pushing. This is the step that proves
      # the RTK binary actually runs on arm64: the Dockerfile ends its install
      # with `rtk --version`, executed here under QEMU emulation. A libc or
      # release-asset regression fails the build instead of shipping quietly.
      - name: Build both architectures (no push)
        if: steps.changed.outputs.any == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=amd64

      - name: Open pull request
        if: steps.changed.outputs.any == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/weekly-update
          delete-branch: true
          commit-message: 'chore(deps): weekly pi + RTK update'
          title: 'chore(deps): weekly pi + RTK update'
          labels: dependencies
          body: |
            Automated weekly update. All gates passed before this PR was opened.

            | | Before | After |
            |---|---|---|
            | pi | `${{ steps.pi.outputs.before }}` | `${{ steps.pi.outputs.after }}` |
            | RTK | `${{ steps.rtk.outputs.current }}` | `${{ steps.rtk.outputs.latest }}` |
            | Add-on | `${{ steps.version.outputs.current }}` | `${{ steps.version.outputs.next }}` |

            Verified: `typecheck`, `test`, `format:check`, and a real
            `linux/amd64` + `linux/arm64` image build — the latter executes
            `rtk --version` under QEMU, so an arm64-incompatible RTK release
            fails here rather than on your Pi.

            The add-on version is bumped here on purpose. Merging without it
            would republish the same image tag with different content, and the
            Supervisor — which compares the installed version against
            `config.yaml` — would never offer your Pi the update.

            Not verified: runtime behaviour in Home Assistant.
